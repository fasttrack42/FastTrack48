<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastTrack48 Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23a98bff' stroke-width='6' stroke-dasharray='10 5'/%3E%3C/svg%3E">
<meta name="description" content="Browse the FastTrack48 fasting knowledge base: evidence-graded cards in 10 languages, with sources.">
<style>
:root {
	--bg: #f7f5f2; --surface: #ffffff; --surface-2: #f0ede8; --text: #1d1b20; --muted: #625d68;
	--line: #e2ddd6; --accent: #6b4fd8; --accent-soft: #ece7fd; --focus: #6b4fd8;
	--stop: #c62828; --stop-soft: #fdecec; --caution: #a86400; --caution-soft: #fdf3e2;
	--a: #1f7a4d; --b: #2c6db5; --c: #8a5a00; --d: #6d6875;
	--radius: 14px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 2px 8px rgb(0 0 0 / .04);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #15131a; --surface: #1e1b24; --surface-2: #27232f; --text: #ece9f1; --muted: #a59fae;
		--line: #34303d; --accent: #ab97ff; --accent-soft: #2d2647; --focus: #ab97ff;
		--stop: #ff8a80; --stop-soft: #3a1f22; --caution: #f2b45a; --caution-soft: #372b18;
		--a: #6fd3a0; --b: #8cbcf5; --c: #e5b866; --d: #b3adbb;
		--shadow: none; color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #15131a; --surface: #1e1b24; --surface-2: #27232f; --text: #ece9f1; --muted: #a59fae;
	--line: #34303d; --accent: #ab97ff; --accent-soft: #2d2647; --focus: #ab97ff;
	--stop: #ff8a80; --stop-soft: #3a1f22; --caution: #f2b45a; --caution-soft: #372b18;
	--a: #6fd3a0; --b: #8cbcf5; --c: #e5b866; --d: #b3adbb;
	--shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--text);
	font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(#f6a06a 0 20%, #e88fc6 0 40%, #a98bff 0 60%, #f3ede2 0 80%, #e6cf86 0); }
.tabs { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.tab { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.lang { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.search { position: relative; flex: 1 1 320px; }
.search input { width: 100%; padding: 10px 36px 10px 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 50%; translate: 0 -50%; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px 8px; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }

/* layout */
.layout { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 899px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.filters { position: sticky; top: 132px; max-height: calc(100vh - 148px); overflow: auto; padding-bottom: 8px; }
@media (max-width: 899px) { .filters { position: static; max-height: none; } }
.filters > details > summary { list-style: none; cursor: pointer; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; }
.filters > details > summary::-webkit-details-marker { display: none; }
@media (min-width: 900px) { .filters > details > summary { display: none; } }
.facet { margin: 14px 0 0; }
.facet h3 { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .875rem; display: inline-flex; gap: 6px; align-items: center; text-align: left; }
.chip .n { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.facet-cat .chip { width: 100%; justify-content: space-between; border-radius: 10px; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; margin-top: 14px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* list */
.status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
.status .spacer { margin-left: auto; }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.group { margin: 22px 0 8px; }
.group:first-child { margin-top: 4px; }
.group h2 { font-size: 1.1rem; margin: 0; }
.group p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.cards { display: grid; gap: 10px; margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); scroll-margin-top: 140px; }
.card.sev-caution { border-left-color: var(--caution); }
.card.sev-stop { border-left-color: var(--stop); }
.card:target { outline: 2px solid var(--accent); }
.card > summary { list-style: none; cursor: pointer; padding: 14px 16px 12px; display: block; }
.card > summary::-webkit-details-marker { display: none; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; font-size: .78rem; }
.badge { padding: 1px 8px; border-radius: 999px; font-weight: 600; border: 1px solid currentColor; }
.g-A { color: var(--a); } .g-B { color: var(--b); } .g-C { color: var(--c); } .g-D { color: var(--d); }
.s-stop { color: var(--stop); background: var(--stop-soft); border-color: transparent; }
.s-caution { color: var(--caution); background: var(--caution-soft); border-color: transparent; }
.cid { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.card h4 { margin: 0; font-size: 1.05rem; line-height: 1.35; display: flex; gap: 8px; justify-content: space-between; }
.chev { flex: none; color: var(--muted); transition: rotate .15s; margin-top: 3px; }
.card[open] .chev { rotate: 180deg; }
.claim { margin: 4px 0 0; display: block; }
.body { padding: 0 16px 14px; border-top: 1px dashed var(--line); }
.sec { margin-top: 12px; }
.sec h5 { margin: 0 0 2px; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sec p { margin: 0; }
.sec.do { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
.sec.caveat { background: var(--caution-soft); border-radius: 10px; padding: 8px 12px; }
.orig { display: block; color: var(--muted); font-size: .88rem; font-style: italic; margin-top: 3px; }
.missing { color: var(--caution); font-size: .75rem; font-weight: 600; margin-left: 6px; font-style: normal; }
.srcs { margin: 0; padding-left: 18px; font-size: .9rem; }
.foot { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.tag { background: var(--surface-2); border-radius: 6px; padding: 1px 7px; }
.tag.cond { background: var(--accent-soft); color: var(--text); }
.copy { margin-left: auto; }
.empty, .msg { text-align: center; padding: 48px 16px; color: var(--muted); }
.msg.err { color: var(--stop); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .chev { transition: none; } }

/* sources */
.sources { max-width: 820px; margin: 0 auto; padding: 16px; }
.sources h2 { margin: 8px 0 4px; }
.sources .lead p { margin: 8px 0; }
.note { background: var(--caution-soft); border-radius: 12px; padding: 10px 14px; }
.bib { list-style: none; padding: 0; display: grid; gap: 8px; }
.bib li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.bib .short { font-weight: 600; }
.bib .text { color: var(--muted); font-size: .9rem; margin: 2px 0 6px; overflow-wrap: anywhere; }
.bib .acts { display: flex; gap: 14px; font-size: .88rem; flex-wrap: wrap; }
footer.page { max-width: 1180px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: .82rem; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: .9rem; z-index: 9; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header class="top">
	<div class="top-inner">
		<div class="row">
			<div class="brand"><span class="brand-dot" aria-hidden="true"></span><span>FastTrack48</span></div>
			<div class="tabs" role="tablist" aria-label="View">
				<button class="tab" role="tab" id="tab-cards" aria-controls="view-cards"></button>
				<button class="tab" role="tab" id="tab-sources" aria-controls="view-sources"></button>
			</div>
			<label class="row" style="gap:6px"><span class="sr" style="color:var(--muted);font-size:.9rem">Language</span>
				<select id="lang" class="lang" aria-label="Language"></select></label>
		</div>
		<div class="row" id="search-row">
			<div class="search">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
				<input id="q" type="search" autocomplete="off" spellcheck="false">
				<button class="clear" id="q-clear" hidden></button>
			</div>
			<span style="color:var(--muted);font-size:.85rem"><kbd>/</kbd> search · <kbd>Esc</kbd> clear</span>
		</div>
	</div>
</header>

<div id="view-cards" role="tabpanel" aria-labelledby="tab-cards">
	<div class="layout">
		<aside class="filters" aria-label="Filters"><details id="filters-box" open><summary id="filters-sum">Filters</summary><div id="facets"></div></details></aside>
		<main>
			<div class="status"><span id="count" aria-live="polite"></span><span class="active" id="active"></span><span class="spacer"></span>
				<button class="linkbtn" id="copy-view">Copy link to this view</button>
				<button class="linkbtn" id="expand-all">Expand all</button></div>
			<div id="list"><div class="msg"><div class="spinner"></div>Loading the library…</div></div>
		</main>
	</div>
</div>
<div id="view-sources" role="tabpanel" aria-labelledby="tab-sources" hidden><section class="sources" id="sources"></section></div>
<footer class="page" id="foot"></footer>

<script>
"use strict";
/* ---------- config ---------- */
const params = new URLSearchParams(location.search);
const REPO = "fasttrack42/FastTrack48";
// The Pages workflow (static.yml) rewrites this to the deployed commit, so the data matches the deploy and jsDelivr's
// branch cache (up to ~12 h for @master) never serves stale cards.
const DEFAULT_REF = "master";
const REF = /^[\w.\-\/]{1,100}$/.test(params.get("ref") || "") ? params.get("ref") : DEFAULT_REF;
// ?base= overrides the data location (https URL or a relative path such as ./ when served next to the files).
const BASE = (() => {
	const b = params.get("base");
	if (b && (/^https:\/\//.test(b) || /^\.{0,2}\//.test(b))) return b.endsWith("/") ? b : b + "/";
	return `https://cdn.jsdelivr.net/gh/${REPO}@${REF}/knowledge/`;
})();
const LANGS = [["en", "English"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"], ["it", "Italiano"],
	["nl", "Nederlands"], ["pt-BR", "Português (Brasil)"], ["uk", "Українська"], ["zh-CN", "简体中文"], ["zh-Hant", "繁體中文"]];
const HTML_LANG = { "zh-Hant": "zh-Hant", "zh-CN": "zh-Hans" };
const CAT_ORDER = ["essentials", "journey", "mind", "food", "rhythm", "comfort", "women", "medical", "traditions"];
const GRADES = ["A", "B", "C", "D"];
const GRADE_HINT = { A: "Trials, meta-analyses or textbook physiology", B: "Small human trials or observational studies",
	C: "Animal or mechanistic studies only", D: "Clinical experience or expert opinion" };
const SAFETY = ["stop", "caution", "none"];
const SAFETY_LABEL = { stop: "Stop sign", caution: "Caution", none: "General" };
const SAFETY_HINT = { stop: "A reason not to fast, or to end the fast", caution: "Needs care or monitoring", none: "No special risk" };
const BOOK = "Fung & Moore 2016, The Complete Guide to Fasting";
const GROUP = { book: "books", study: "studies", guideline: "studies", web: "studies", video: "talks" };
const GROUP_ORDER = ["books", "studies", "talks"];

/* ---------- state ---------- */
const listParam = k => new Set((params.get(k) || "").split(",").map(s => s.trim()).filter(Boolean));
const S = {
	lang: null, tab: params.get("tab") === "sources" ? "sources" : "cards", q: params.get("q") || "",
	cat: listParam("cat"), grade: listParam("grade"), safety: listParam("safety"), cond: listParam("cond"),
	ref: params.get("src") || "", showEn: params.get("en") === "1", allOpen: false,
};
const D = { cards: [], refs: new Map(), en: { ui: {} }, tr: null, cache: new Map() };

/* ---------- helpers ---------- */
function h(tag, props, ...kids) {
	const el = document.createElement(tag);
	for (const [k, v] of Object.entries(props || {})) {
		if (v == null || v === false) continue;
		if (k === "class") el.className = v;
		else if (k === "text") el.textContent = v;
		else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
		else el.setAttribute(k, v === true ? "" : String(v));
	}
	for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
	return el;
}
const $ = id => document.getElementById(id);
const fold = s => String(s || "").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase();
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
const str = v => (typeof v === "string" ? v : "");
function ui(key) {
	const t = D.tr && D.tr.ui && D.tr.ui[key];
	return str(t) || str(D.en.ui[key]) || key;
}
let toastTimer;
function toast(msg) {
	document.querySelector(".toast")?.remove();
	const t = h("div", { class: "toast", role: "status", text: msg });
	document.body.append(t);
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => t.remove(), 2600);
}

/* cite -> references.json key, and the short form shown on a card (mirrors export_android.py) */
function refKey(s) {
	if (s.startsWith("CGF")) return "CGF";
	const m = s.match(/^YT ([\w-]{11})(?:@[\d:]+)?(?:\s*\(.*\))?$/);
	return m ? `YT ${m[1]}` : s;
}
function readable(s) {
	const t = s.startsWith("CGF") ? s.replace(/\s*\([^)]*\)$/, "") : s;
	let m;
	if ((m = t.match(/^CGF ch(\d+)$/))) return `${BOOK}, ch. ${m[1]}`;
	if (t === "CGF intro") return `${BOOK}, introduction`;
	if (t === "CGF resources") return `${BOOK}, part III`;
	return D.refs.get(refKey(s))?.short || s;
}
function cardSources(c) {
	const seen = new Map();
	for (const s of c.src) {
		const label = readable(s);
		if (!seen.has(label)) seen.set(label, D.refs.get(refKey(s)));
	}
	const nat = r => r.replace(/\d+/g, d => d.padStart(4, "0"));
	return [...seen].sort(([a, ra], [b, rb]) =>
		(GROUP_ORDER.indexOf(GROUP[ra?.kind] || "studies") - GROUP_ORDER.indexOf(GROUP[rb?.kind] || "studies")) || nat(a).localeCompare(nat(b)));
}
function when(w) {
	let m;
	if ((m = w.match(/^stage:(\d+)-(\d+)$/))) return `${m[1]}–${m[2]} h`;
	if ((m = w.match(/^stage:(\d+)\+$/))) return `${m[1]}+ h`;
	if ((m = w.match(/^symptom:(.+)$/))) return m[1];
	return w;
}
const condLabel = c => ui("cond_" + c.replace(/-/g, "_"));
const gradeLabel = g => ui("label_" + g.toLowerCase());

/* ---------- data ---------- */
async function fetchText(path) {
	const r = await fetch(BASE + path);
	if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
	return r.text();
}
function parseJsonl(text) {
	const out = [];
	for (const line of text.split("\n")) {
		const l = line.trim();
		if (!l) continue;
		try { out.push(JSON.parse(l)); } catch { /* skip a malformed line rather than lose the library */ }
	}
	return out;
}
function normCard(c) {
	if (!c || typeof c !== "object" || typeof c.id !== "string") return null;
	const arr = v => (Array.isArray(v) ? v.filter(x => typeof x === "string") : []);
	const card = {
		id: c.id, cat: str(c.cat) || "other", grade: GRADES.includes(c.grade) ? c.grade : "D",
		safety: SAFETY.includes(c.safety) ? c.safety : "none",
		title: str(c.title), claim: str(c.claim), why: str(c.why), do: str(c.do), counter: str(c.counter),
		when: arr(c.when), aud: arr(c.aud), cond: arr(c.cond), src: arr(c.src), gate: str(c.gate),
	};
	card.refKeys = new Set(card.src.map(refKey));
	return card;
}
async function loadLang(code) {
	if (code === "en") return D.en;
	if (D.cache.has(code)) return D.cache.get(code);
	const j = JSON.parse(await fetchText(`i18n/${code}.json`));
	const tr = { ui: j && typeof j.ui === "object" ? j.ui : {}, cards: j && typeof j.cards === "object" ? j.cards : {} };
	D.cache.set(code, tr);
	return tr;
}
function pickLang() {
	const codes = LANGS.map(l => l[0]);
	const want = [params.get("lang")];
	try { want.push(localStorage.getItem("kb-lang")); } catch {}
	want.push(...(navigator.languages || [navigator.language]));
	for (const w of want) {
		if (!w) continue;
		const exact = codes.find(c => c.toLowerCase() === w.toLowerCase());
		if (exact) return exact;
		const base = w.toLowerCase().split("-")[0];
		if (base === "zh") return /hant|tw|hk|mo/i.test(w) ? "zh-Hant" : "zh-CN";
		if (base === "pt") return "pt-BR";
		const b = codes.find(c => c.split("-")[0] === base);
		if (b) return b;
	}
	return "en";
}

/* ---------- text of a card in the current language ---------- */
function field(c, f) {
	const t = S.lang !== "en" && D.tr?.cards?.[c.id];
	const v = t && str(t[f]);
	return { text: v || c[f], fallback: S.lang !== "en" && !v && !!c[f] };
}
function haystack(c) {
	const k = S.lang + "|" + c.id;
	if (haystack.cache.has(k)) return haystack.cache.get(k);
	const parts = [c.id, c.cat, ui("cat_" + c.cat)];
	for (const f of ["title", "claim", "why", "do", "counter"]) parts.push(field(c, f).text, c[f]);
	parts.push(...cardSources(c).map(([l]) => l), ...c.cond.map(condLabel), ...c.when.map(when));
	const s = fold(parts.join(" "));
	haystack.cache.set(k, s);
	return s;
}
haystack.cache = new Map();

/* ---------- filtering ---------- */
function matches(c, skip) {
	if (skip !== "cat" && S.cat.size && !S.cat.has(c.cat)) return false;
	if (skip !== "grade" && S.grade.size && !S.grade.has(c.grade)) return false;
	if (skip !== "safety" && S.safety.size && !S.safety.has(c.safety)) return false;
	if (skip !== "cond" && S.cond.size && !c.cond.some(x => S.cond.has(x))) return false;
	if (S.ref && !c.refKeys.has(S.ref)) return false;
	const terms = fold(S.q).split(/\s+/).filter(Boolean);
	if (terms.length) { const hs = haystack(c); if (!terms.every(t => hs.includes(t))) return false; }
	return true;
}
const activeCount = () => S.cat.size + S.grade.size + S.safety.size + S.cond.size + (S.ref ? 1 : 0);

/* ---------- URL ---------- */
/* Every filterable criterion: lang, tab, q, cat, grade, safety, cond, src (cited reference), en (English originals). */
function stateParams(withLang, extraCat) {
	const p = new URLSearchParams();
	if (params.get("base")) p.set("base", params.get("base"));
	if (REF !== DEFAULT_REF) p.set("ref", REF);
	if (withLang) p.set("lang", S.lang);
	if (S.tab !== "cards") p.set("tab", S.tab);
	if (S.q) p.set("q", S.q);
	for (const k of ["cat", "grade", "safety", "cond"]) {
		const v = new Set(S[k]);
		if (k === "cat" && extraCat) v.add(extraCat);
		if (v.size) p.set(k, [...v].join(","));
	}
	if (S.ref) p.set("src", S.ref);
	if (S.showEn) p.set("en", "1");
	return p;
}
function syncUrl() {
	// The address bar names the language only when the URL chose it, so pasting it elsewhere follows that
	// reader's browser; copied links always name it.
	const qs = stateParams(params.has("lang")).toString();
	history.replaceState(null, "", (qs ? "?" + qs : location.pathname) + location.hash);
}

/* ---------- render: chrome ---------- */
function renderChrome() {
	document.documentElement.lang = HTML_LANG[S.lang] || S.lang;
	$("tab-cards").textContent = ui("library_title");
	$("tab-sources").textContent = ui("sources_title");
	$("q").placeholder = ui("search_hint");
	$("q").setAttribute("aria-label", ui("search_hint"));
	$("q-clear").textContent = "✕";
	$("q-clear").setAttribute("aria-label", ui("clear_search"));
	for (const t of ["cards", "sources"]) {
		$("tab-" + t).setAttribute("aria-selected", String(S.tab === t));
		$("view-" + t).hidden = S.tab !== t;
	}
	$("search-row").hidden = S.tab !== "cards";
	$("foot").replaceChildren(h("p", { text: ui("sources_medical") }),
		h("p", {}, "Data: ", h("a", { href: `https://github.com/${REPO}/tree/${REF}/knowledge`, text: `${REPO}@${REF}/knowledge` }),
			" · loaded from ", h("code", { text: BASE.replace(/^https:\/\//, "") })));
}

function chip(label, n, pressed, onclick, title) {
	return h("button", { class: "chip", "aria-pressed": String(pressed), disabled: !pressed && n === 0, title, onclick },
		h("span", { text: label }), n != null ? h("span", { class: "n", text: n }) : null);
}
function toggleIn(set, v) { set.has(v) ? set.delete(v) : set.add(v); update(); }

function renderFacets() {
	const count = (skip, key, pick) => {
		const m = new Map();
		for (const c of D.cards) if (matches(c, skip)) for (const v of pick(c)) m.set(v, (m.get(v) || 0) + 1);
		return m;
	};
	const cats = count("cat", "cat", c => [c.cat]);
	const grades = count("grade", "grade", c => [c.grade]);
	const safety = count("safety", "safety", c => [c.safety]);
	const conds = count("cond", "cond", c => c.cond);
	const allConds = [...new Set(D.cards.flatMap(c => c.cond))].sort((a, b) => condLabel(a).localeCompare(condLabel(b)));
	const catList = [...CAT_ORDER, ...new Set(D.cards.map(c => c.cat).filter(c => !CAT_ORDER.includes(c)))];
	const facet = (title, cls, kids) => h("section", { class: "facet " + (cls || "") }, h("h3", { text: title }), h("div", { class: "chips" }, kids));

	$("facets").replaceChildren(
		facet("Topic", "facet-cat", catList.filter(c => D.cards.some(x => x.cat === c)).map(c =>
			chip(ui("cat_" + c), cats.get(c) || 0, S.cat.has(c), () => toggleIn(S.cat, c), ui("cat_" + c + "_sub")))),
		facet("Evidence", "", GRADES.map(g => chip(`${g} · ${gradeLabel(g)}`, grades.get(g) || 0, S.grade.has(g), () => toggleIn(S.grade, g), GRADE_HINT[g]))),
		facet("Safety", "", SAFETY.map(s => chip(SAFETY_LABEL[s], safety.get(s) || 0, S.safety.has(s), () => toggleIn(S.safety, s), SAFETY_HINT[s]))),
		facet("Health condition", "", allConds.map(c => chip(condLabel(c), conds.get(c) || 0, S.cond.has(c), () => toggleIn(S.cond, c)))),
		S.lang !== "en" ? h("label", { class: "toggle" },
			h("input", { type: "checkbox", checked: S.showEn, onchange: e => { S.showEn = e.target.checked; update(); } }),
			"Show English original") : null,
	);
	const n = activeCount();
	$("filters-sum").textContent = n ? `Filters (${n})` : "Filters";
}

/* ---------- render: cards ---------- */
function textBlock(c, f, tag = "p", cls) {
	const { text, fallback } = field(c, f);
	const showOrig = S.showEn && S.lang !== "en" && !fallback && c[f] && text !== c[f];
	return h(tag, { class: cls }, text, fallback ? h("span", { class: "missing", text: "EN", title: "Not translated yet; English shown" }) : null,
		showOrig ? h("span", { class: "orig", lang: "en", text: c[f] }) : null);
}
function renderCard(c, open) {
	const chev = h("span", { class: "chev", "aria-hidden": "true", text: "▾" });
	const d = h("details", { class: `card sev-${c.safety}`, id: c.id, open: open });
	const summary = h("summary", {},
		h("span", { class: "meta" },
			h("span", { class: `badge g-${c.grade}`, title: GRADE_HINT[c.grade], text: `${c.grade} · ${gradeLabel(c.grade)}` }),
			c.safety !== "none" ? h("span", { class: `badge s-${c.safety}`, title: SAFETY_HINT[c.safety], text: SAFETY_LABEL[c.safety] }) : null,
			h("span", { class: "cid", text: c.id })),
		h("h4", {}, textBlock(c, "title", "span"), chev),
		textBlock(c, "claim", "span", "claim"));
	const srcs = cardSources(c);
	const body = h("div", { class: "body" },
		c.why ? h("div", { class: "sec" }, h("h5", { text: ui("why") }), textBlock(c, "why")) : null,
		c.do ? h("div", { class: "sec do" }, h("h5", { text: ui("what_to_do") }), textBlock(c, "do")) : null,
		c.counter ? h("div", { class: "sec caveat" }, h("h5", { text: ui("caveat") }), textBlock(c, "counter")) : null,
		srcs.length ? h("div", { class: "sec" }, h("h5", { text: ui("sources") }),
			h("ul", { class: "srcs" }, srcs.map(([label, ref]) => {
				const url = safeUrl(ref?.url);
				return h("li", { title: ref?.text || null }, url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", text: label }) : label);
			}))) : null,
		h("div", { class: "foot" },
			c.cond.map(x => h("span", { class: "tag cond", text: condLabel(x) })),
			c.when.map(w => h("span", { class: "tag", title: "When the app shows it: " + w, text: when(w) })),
			h("a", { class: "linkbtn copy", href: linkFor(c.cat, c.id), text: "Copy link",
				onclick: e => { e.preventDefault(); copyLink(c.cat, c.id); } })));
	d.append(summary, body);
	// Opening a card puts it in the address bar, so the URL always points at what you're reading.
	d.addEventListener("toggle", () => {
		if (d.open && !S.allOpen && location.hash !== "#" + c.id) history.replaceState(null, "", location.search + "#" + c.id);
	});
	return d;
}
/* Deep link: the current view (language + every filter) plus the card's category and #card id.
   If a filter would hide the card, goToCard() drops it when the link is opened. */
function linkFor(cat, id) {
	return location.origin + location.pathname + "?" + stateParams(true, cat).toString() + (id ? "#" + id : "");
}
async function copyLink(cat, id) {
	const url = linkFor(cat, id);
	try { await navigator.clipboard.writeText(url); toast("Link copied"); }
	catch {
		params.set("lang", S.lang);
		history.replaceState(null, "", url);
		toast("Link is in the address bar");
	}
}
/* "#fc-24", "#FC-024", "#24" -> "FC-024" when such a card exists. */
function cardIdFrom(hash) {
	const raw = decodeURIComponent(hash.replace(/^#/, "")).trim();
	if (!raw) return null;
	const m = raw.match(/^(?:fc-?)?0*(\d{1,4})$/i);
	const id = m ? "FC-" + m[1].padStart(3, "0") : raw.toUpperCase();
	return D.cards.some(c => c.id === id) ? id : null;
}
/* Make the linked card visible (dropping filters that hide it), open it and scroll to it. */
function goToCard(scroll = true) {
	const id = cardIdFrom(location.hash);
	if (!id) return;
	const c = D.cards.find(x => x.id === id);
	if (location.hash !== "#" + id) history.replaceState(null, "", location.search + "#" + id);
	if (!matches(c)) {
		S.q = ""; $("q").value = ""; $("q-clear").hidden = true; S.ref = "";
		for (const k of ["grade", "safety", "cond"]) S[k].clear();
		if (S.cat.size && !S.cat.has(c.cat)) S.cat = new Set([c.cat]);
	}
	S.tab = "cards";
	update();
	const el = document.getElementById(id);
	if (el) { el.open = true; if (scroll) el.scrollIntoView({ block: "start" }); }
}

function renderList() {
	const shown = D.cards.filter(c => matches(c));
	$("count").textContent = `${shown.length} / ${D.cards.length}`;
	const act = [];
	if (S.ref) act.push(h("button", { class: "chip", "aria-pressed": "true", title: "Remove", onclick: () => { S.ref = ""; update(); } },
		`${ui("sources")}: ${D.refs.get(S.ref)?.short || S.ref}`, h("span", { class: "n", text: "✕" })));
	if (activeCount() || S.q) act.push(h("button", { class: "linkbtn", text: "Clear all", onclick: clearAll }));
	$("active").replaceChildren(...act);
	$("expand-all").textContent = S.allOpen ? "Collapse all" : "Expand all";

	if (!shown.length) {
		$("list").replaceChildren(h("div", { class: "empty" }, h("p", { text: ui("no_results") }),
			h("button", { class: "chip", text: "Clear search and filters", onclick: clearAll })));
		return;
	}
	const target = location.hash.slice(1);
	const order = [...CAT_ORDER, ...new Set(shown.map(c => c.cat))];
	const groups = [];
	for (const cat of new Set(order)) {
		const cs = shown.filter(c => c.cat === cat);
		if (!cs.length) continue;
		groups.push(h("section", { class: "group", id: "cat-" + cat },
			h("div", { class: "row" }, h("h2", { text: ui("cat_" + cat) }),
				h("a", { class: "linkbtn", href: linkFor(cat), style: "font-size:.8rem;margin-left:auto", text: "Copy link to topic",
					onclick: e => { e.preventDefault(); copyLink(cat); } })),
			h("p", { text: ui("cat_" + cat + "_sub") }),
			h("div", { class: "cards" }, cs.map(c => renderCard(c, S.allOpen || c.id === target)))));
	}
	$("list").replaceChildren(...groups);
}
function clearAll() {
	S.q = ""; $("q").value = ""; S.ref = "";
	for (const k of ["cat", "grade", "safety", "cond"]) S[k].clear();
	update();
}

/* ---------- render: sources ---------- */
function renderSources() {
	const cites = new Map();
	for (const c of D.cards) for (const k of c.refKeys) cites.set(k, (cites.get(k) || 0) + 1);
	const groups = new Map(GROUP_ORDER.map(g => [g, []]));
	for (const r of D.refs.values()) groups.get(GROUP[r.kind] || "studies").push(r);
	const label = { books: ui("sources_books"), studies: ui("sources_studies"), talks: ui("sources_talks") };
	$("sources").replaceChildren(
		h("div", { class: "lead" }, h("h2", { text: ui("sources_title") }), h("p", { text: ui("sources_credits") }),
			h("p", { text: ui("sources_independence") }), h("p", { class: "note", text: ui("sources_medical") })),
		...GROUP_ORDER.filter(g => groups.get(g).length).map(g => h("section", {},
			h("h2", { text: `${label[g]} (${groups.get(g).length})` }),
			h("ul", { class: "bib" }, groups.get(g).sort((a, b) => a.short.localeCompare(b.short)).map(r => {
				const url = safeUrl(r.url), n = cites.get(r.key) || 0;
				return h("li", {}, h("div", { class: "short", text: r.short }), h("div", { class: "text", text: r.text }),
					h("div", { class: "acts" },
						n ? h("button", { class: "linkbtn", text: n === 1 ? "1 card" : `${n} cards`,
							onclick: () => { S.ref = r.key; S.tab = "cards"; update(); scrollTo(0, 0); } }) : h("span", { text: "Not cited by a card" }),
						url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", text: "Open source ↗" }) : null));
			})))));
}

/* ---------- update loop ---------- */
function update() {
	renderChrome();
	if (S.tab === "cards") { renderFacets(); renderList(); } else renderSources();
	syncUrl();
}

async function setLang(code) {
	const prev = S.lang;
	try {
		D.tr = await loadLang(code);
		S.lang = code;
		try { localStorage.setItem("kb-lang", code); } catch {}
	} catch (e) {
		toast(`Couldn't load ${code}: ${e.message}`);
		S.lang = prev || "en";
		D.tr = await loadLang(S.lang).catch(() => D.en);
	}
	$("lang").value = S.lang;
	update();
}

/* ---------- events ---------- */
$("lang").append(...LANGS.map(([c, n]) => h("option", { value: c, text: n })));
$("lang").addEventListener("change", e => { params.delete("lang"); setLang(e.target.value); });
for (const t of ["cards", "sources"]) $("tab-" + t).addEventListener("click", () => { S.tab = t; update(); });
let qTimer;
$("q").value = S.q;
$("q").addEventListener("input", e => {
	$("q-clear").hidden = !e.target.value;
	clearTimeout(qTimer);
	qTimer = setTimeout(() => { S.q = e.target.value.slice(0, 200); update(); }, 90);
});
$("q-clear").addEventListener("click", () => { $("q").value = ""; $("q-clear").hidden = true; S.q = ""; update(); $("q").focus(); });
$("copy-view").addEventListener("click", () => copyLink());
$("expand-all").addEventListener("click", () => {
	S.allOpen = !S.allOpen;
	document.querySelectorAll("#list details.card").forEach(d => { d.open = S.allOpen; });
	$("expand-all").textContent = S.allOpen ? "Collapse all" : "Expand all";
});
document.addEventListener("keydown", e => {
	const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
	if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) {
		e.preventDefault();
		if (S.tab !== "cards") { S.tab = "cards"; update(); }
		$("q").focus(); $("q").select();
	} else if (e.key === "Escape" && document.activeElement === $("q") && $("q").value) {
		$("q-clear").click();
	}
});
const wide = matchMedia("(min-width: 900px)");
const fitFilters = () => { $("filters-box").open = wide.matches; };
wide.addEventListener("change", fitFilters);
fitFilters();
window.addEventListener("hashchange", () => { if (D.cards.length) goToCard(); });

/* ---------- boot ---------- */
(async function boot() {
	$("q-clear").hidden = !S.q;
	try {
		const [core, refs, en] = await Promise.all([
			fetchText("core.jsonl").then(parseJsonl),
			fetchText("references.json").then(JSON.parse),
			fetchText("i18n/en.json").then(JSON.parse),
		]);
		D.cards = core.map(normCard).filter(Boolean);
		if (!D.cards.length) throw new Error("core.jsonl has no cards");
		for (const r of Array.isArray(refs) ? refs : []) {
			if (r && typeof r.key === "string") D.refs.set(r.key, { key: r.key, kind: str(r.kind), short: str(r.short) || r.key, text: str(r.text), url: str(r.url) });
		}
		D.en = { ui: en && typeof en.ui === "object" ? en.ui : {}, cards: {} };
		// A hand-edited or stale link may name values that don't exist; drop them rather than show nothing.
		const known = { cat: c => [c.cat], grade: c => [c.grade], safety: c => [c.safety], cond: c => c.cond };
		for (const [k, pick] of Object.entries(known)) {
			const ok = new Set(D.cards.flatMap(pick));
			S[k] = new Set([...S[k]].filter(v => ok.has(v)));
		}
		if (S.ref && !D.cards.some(c => c.refKeys.has(S.ref))) S.ref = "";
	} catch (e) {
		$("list").replaceChildren(h("div", { class: "msg err" },
			h("p", { text: "Couldn't load the library." }), h("p", { text: String(e.message || e) }),
			h("p", {}, h("button", { class: "chip", text: "Try again", onclick: () => location.reload() }))));
		return;
	}
	await setLang(pickLang());
	goToCard();
})();
</script>
</body>
