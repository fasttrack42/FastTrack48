name: 🌐 Bad Translation
description: Typo, awkward phrasing, untranslated text, request for a new language.
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Deutsch
        - Español
        - Français
        - Italiano
        - Nederlands
        - Português (Brasil)
        - Українська
        - 简体中文
        - A new language
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: What should change?
      description: Where it appears, what it says now, and what it should say. Drag and drop a screenshot
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Want to help?
      options:
        - label: I'm willing to translate more text in this language.
          required: false
